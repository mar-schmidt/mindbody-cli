[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindbody-cli"
version = "0.1.0"
description = "Unofficial agent-first JSON CLI for the Mindbody consumer APIs"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "mar-schmidt"}]
keywords = ["mindbody", "fitness", "cli", "booking", "agent"]
dependencies = [
  "click>=8.0.0",
  "httpx>=0.27.0",
  "keyring>=25.2.0",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "respx>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/mar-schmidt/mindbody-cli"
Issues = "https://github.com/mar-schmidt/mindbody-cli/issues"

[project.scripts]
mindbody = "mindbody_cli.main:run"
mb = "mindbody_cli.main:run"

[tool.setuptools]
packages = ["mindbody_cli", "mindbody_cli.client", "mindbody_cli.commands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
