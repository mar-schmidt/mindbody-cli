name: Test and Release

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyyaml

      - name: Verify the skill manifest is committed in sync
        run: |
          python scripts/generate-skill-manifest.py
          if ! git diff --exit-code -- .agent/skill.json; then
            echo "::error::.agent/skill.json is stale. Regenerate it:"
            echo "::error::  python scripts/generate-skill-manifest.py"
            exit 1
          fi

      - name: Test
        run: python -m pytest -q

      - name: Smoke-test the entry point
        env:
          MINDBODY_CLI_TOKEN_BACKEND: file
          MINDBODY_CLI_TOKEN_PATH: ${{ runner.temp }}/tokens.json
        run: |
          mindbody --help > /dev/null
          # A logged-out read must fail with the documented auth exit code.
          set +e
          mindbody bookings list > /dev/null 2> err.json
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }
          python -c "import json;d=json.load(open('err.json'));assert d['code']=='login_required',d"

  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "." pyyaml build

      - name: Build skill archive and wheel
        run: |
          python scripts/generate-skill-manifest.py
          python scripts/package-skill.py
          python -m build --wheel --outdir dist/

      - name: Compute release tag
        id: meta
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v${version}-${GITHUB_RUN_NUMBER}"
          {
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.meta.outputs.tag }}'
          sha_short=$(git rev-parse --short HEAD)

          {
            echo "Automated release from commit \`${sha_short}\` on \`master\`."
            echo
            echo "## Install the CLI"
            echo
            echo '```bash'
            echo 'pip install "git+https://github.com/${{ github.repository }}.git"'
            echo '```'
            echo
            echo "## Agent skill"
            echo
            echo "\`mindbody-cli.skill\` below is a zip archive containing"
            echo "\`SKILL.md\`, \`skill.json\` and usage examples."
            echo
            echo "## Changes"
            echo
            git log -1 --pretty=format:'%s%n%n%b'
            echo
            echo "---"
            echo
            echo "Unofficial project, not affiliated with Mindbody, Inc."
            echo "See DISCLAIMER.md."
          } > notes.md

          gh release create "$tag" \
            --title "$tag" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            dist/mindbody-cli.skill \
            dist/*.whl
